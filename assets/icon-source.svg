<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="800" y1="150" x2="280" y2="900">
      <stop offset="0" stop-color="#3BD8AC"/>
      <stop offset="0.5" stop-color="#2FA6DC"/>
      <stop offset="1" stop-color="#4A63EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ED0C8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3ED0C8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Klemmbrett -->
    <rect x="280" y="285" width="460" height="525" rx="36" stroke="url(#g)" stroke-width="34"/>
    <!-- Klammer (weiss freigestellt) -->
    <rect x="402" y="238" width="220" height="86" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="64"/>
    <rect x="402" y="238" width="220" height="86" rx="16" stroke="url(#g)" stroke-width="30"/>
    <circle cx="512" cy="281" r="13" stroke="url(#g)" stroke-width="20"/>
    <!-- Glow hinter der Birne -->
    <circle cx="490" cy="500" r="160" fill="url(#glow)"/>
    <!-- Strahlen -->
    <path d="M400 396 l-32 -32" stroke="url(#g)" stroke-width="24"/>
    <path d="M580 396 l32 -32" stroke="url(#g)" stroke-width="24"/>
    <path d="M336 500 h40" stroke="url(#g)" stroke-width="24"/>
    <path d="M604 500 h40" stroke="url(#g)" stroke-width="24"/>
    <!-- Birne: Glas mit Hals, kleines Filament, gestreifter Sockel -->
    <path d="M437 551 a82 82 0 1 1 106 0 l-7 40 h-92 z" stroke="url(#g)" stroke-width="26"/>
    <path d="M472 550 a18 18 0 0 1 36 0" stroke="url(#g)" stroke-width="16"/>
    <path d="M458 630 h64" stroke="url(#g)" stroke-width="22"/>
    <path d="M464 666 h52" stroke="url(#g)" stroke-width="22"/>
    <path d="M479 700 h22" stroke="url(#g)" stroke-width="24"/>
    <!-- Stift (weiss freigestellt, quer ueber die rechte Kante) -->
    <g transform="rotate(33 700 560)">
      <g stroke="#ffffff" stroke-width="64">
        <path d="M676 384 h48 v260 h-48 z"/>
        <path d="M676 700 l24 62 l24 -62"/>
      </g>
      <path d="M676 384 h48 v260 h-48 z" stroke="url(#g)" stroke-width="26"/>
      <path d="M676 452 h48" stroke="url(#g)" stroke-width="22"/>
      <path d="M676 700 l24 62 l24 -62 z" stroke="url(#g)" stroke-width="24"/>
    </g>
  </g>
